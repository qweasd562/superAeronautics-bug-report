name: Bug report
description: Report a crash or bug.
title: "[Bug] "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Report a crash or bug and describe it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug or crash. Include the exact error message, if there is one.
      placeholder: |
        What happened:
        What I expected:
    validations:
      required: true

  - type: dropdown
    id: modpack-version
    attributes:
      label: Modpack version
      description: Which modpack version were you using when the problem happened?
      options:
        - "6.5.2"
        - "6.5.1"
        - "6.0.0"
        - "5.0.0"
        - "4.5.0"
        - "4.0.0"
        - "3.3.0"
        - "3.2.0"
        - "3.1.0"
        - "3.0.1"
        - "3.0.0"
        - "2.1.0"
        - "2.0.0"
        - "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Starting the game
        - Singleplayer
        - Loading world
        - Playing on a server
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: |
        Open the affected game instance's folder in your launcher and find logs/latest.log. Upload it to [mclo.gs](https://mclo.gs/) and paste the link here, even if the game did not crash.
        If the game crashed, include the matching report from the crash-reports folder too. For development issues, include the build output instead.
        Review logs for personal information before sharing them. If logs are unavailable, explain why.
      placeholder: Paste your log links or explain why logs are unavailable.
    validations:
      required: true

  - type: textarea
    id: other-mods-and-settings
    attributes:
      label: Other mods, packs, or changed settings
      description: Include relevant mods and versions, resource packs, or settings you changed.
      placeholder: |
        Mods you've installed and settings you've changed.
    validations:
      required: false

  - type: textarea
    id: troubleshooting
    attributes:
      label: What have you tried?
      description: Mention anything you tested and whether it helped. If you tested with only this mod and its required dependencies, tell us the result. You do not need to do this before reporting.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots, videos, or extra details
      description: Attach anything that helps demonstrate the problem. For development issues, include a small code example or example project if possible.
    validations:
      required: false
